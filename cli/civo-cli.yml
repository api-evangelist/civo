install:
- method: curl script
  command: curl -sL https://civo.com/get | sh
- method: Homebrew (macOS/Linux)
  command: 'brew tap civo/tools

    brew install civo'
- method: Chocolatey (Windows)
  command: choco install civo-cli
- method: Scoop (Windows)
  command: 'scoop bucket add extras

    scoop install civo'
- method: Linux wget
  command: 'CIVO_VERSION=$(curl -s https://api.github.com/repos/civo/cli/releases/latest | grep ''"tag_name":'' | sed -E ''s/.*"([^"]+)".*/\1/''
    | cut -c2-)

    ARCH=$(uname -m)

    case $ARCH in

    x86_64) ARCH="amd64" ;;

    aarch64) ARCH="arm64" ;;

    armv7l) ARCH="arm" ;;

    *) echo "Unsupported architecture: $ARCH" && exit 1 ;;

    esac

    wget https://github.com/civo/cli/releases/download/v${CIVO_VERSION}/civo-${CIVO_VERSION}-linux-${ARCH}.tar.gz'
- method: Build from source
  command: 'git clone https://github.com/civo/cli.git

    cd cli

    make

    cd ..

    cp -r cli ./$HOME

    export PATH="$HOME/cli:$PATH"'
