apis:
- aid: civo:civo-cloud-api
  name: Civo Cloud API
  description: The Civo Cloud API (v2) covers the Civo cloud platform -- instances, Kubernetes clusters, networks and VPCs, firewalls, volumes, databases, object stores, regions, disk images and webhooks. Requests carry a bearer API key in the Authorization header and 2xx responses are JSON. Civo publishes per-resource reference pages at civo.com/api but no machine-readable contract (no OpenAPI found on api.civo.com or in the civo GitHub org).
  humanURL: https://www.civo.com/api
